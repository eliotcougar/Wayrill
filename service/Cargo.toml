[workspace]
members = ["protocol", "ipc", "daemon", "diagnostics"]
exclude = ["capture"]
resolver = "2"

[workspace.package]
version = "0.32.8"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Enumeration_Pnp", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Services", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Networking_WinInet", "Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.release.package.rquickjs-sys]
opt-level = 3
[profile.release.package.rquickjs-core]
opt-level = 3
