<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayrill Companion</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="mark.svg" width="28" height="28" alt="" />
        <div><strong>Wayrill</strong><span>Companion</span></div>
      </div>
      <div class="header-actions">
        <span
          id="connection"
          class="connection-status"
          role="status"
          title="Connecting to Wayrill…"
        >
          <svg class="connection-check" viewBox="0 0 16 16" aria-hidden="true">
            <path d="m3 8 3 3 7-7" />
          </svg>
          <svg class="connection-cross" viewBox="0 0 16 16" aria-hidden="true">
            <path d="m4 4 8 8m0-8-8 8" />
          </svg>
          <span id="status" class="visually-hidden">Connecting to Wayrill…</span>
        </span>
        <!-- timezone-button -->
        <button id="setup-button" class="quiet" aria-expanded="false" aria-controls="setup">
          Setup
        </button>
      </div>
    </header>
    <main>
      <section id="setup" class="notice" hidden>
        <strong>Connect to Wayrill</strong>
        <p>
          In Wayrill, open <strong>Tools → Browser Companion</strong> to enable or repair the
          connection and open the extension manager or bundled folder. This copy’s extension ID is:
        </p>
        <code id="extension-id"></code>
        <p>Wayrill must include Companion support and be routing your browser’s traffic.</p>
      </section>
      <p id="connection-error" class="notice" hidden></p>
      <!-- timezone-panel -->
      <div id="domains" aria-label="Requested domains"></div>
      <p id="empty" class="empty" hidden></p>
      <p id="capture-warning" class="notice" hidden></p>
      <p id="edit-status" class="notice" role="status" hidden></p>
    </main>
  </body>
</html>
