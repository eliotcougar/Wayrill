name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  native:
    name: Native (${{ matrix.component }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [service, desktop, capture]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/target
      WAYRILL_CURL: C:\msys64\usr\bin\curl.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.component != 'capture'
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: matrix.component != 'capture'
      - name: Install Rust checks
        run: |
          # Rustup installs the channel and components from rust-toolchain.toml.
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
      - name: Cache Rust dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/target
          key: native-${{ runner.os }}-${{ matrix.component }}-${{ hashFiles('rust-toolchain.toml', '.node-version') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-${{ matrix.component }}-${{ hashFiles('rust-toolchain.toml', '.node-version') }}-
      - name: Cache pinned geodata fixtures
        if: matrix.component == 'service'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            service/resource-assets/*.dat
            service/routing-assets/*.dat
          key: native-geodata-${{ hashFiles('service/dependencies.json') }}
      - name: Format, lint and test native code
        run: |
          & ./tools/Check-Native.ps1 -Component '${{ matrix.component }}'
