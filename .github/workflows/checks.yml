name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  native:
    name: Native (${{ matrix.component }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [service, desktop, capture]
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-msvc
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.component != 'capture'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: matrix.component != 'capture'
      - name: Install Rust checks
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
      - name: Cache Rust dependencies and build output
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/target
          key: native-${{ runner.os }}-${{ matrix.component }}-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-${{ matrix.component }}-1.99.0-
      - name: Cache pinned geodata fixtures
        if: matrix.component == 'service'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            service/resource-assets/*.dat
            service/routing-assets/*.dat
          key: native-geodata-${{ hashFiles('service/dependencies.json') }}
      - name: Prepare geodata fixtures
        if: matrix.component == 'service'
        run: |
          # Git for Windows supplies OpenSSL curl; the Windows bundled curl is not used.
          & ./tools/Get-ResourceAssets.ps1 -IncludeRegional -CurlPath 'C:\Program Files\Git\mingw64\bin\curl.exe'
      - name: Format, lint and test native code
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual C++ build tools are required.' }
          & (Join-Path $visualStudio 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          . ./tools/Enter-BuildEnvironment.ps1

          $component = '${{ matrix.component }}'
          $manifest = switch ($component) {
            service { 'service/Cargo.toml' }
            desktop { 'src-tauri/Cargo.toml' }
            capture { 'service/capture/Cargo.toml' }
          }
          if ($component -eq 'desktop') {
            # Native tests do not package the installer or its service binaries.
            $env:TAURI_CONFIG = '{"bundle":{"active":false,"resources":[]}}'
          }
          & cargo fmt --manifest-path $manifest --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $checkArgs = @('--manifest-path', $manifest, '--locked')
          if ($component -eq 'service') { $checkArgs += '--workspace' }
          $variants = @('default')
          if ($component -eq 'capture') { $variants += 'attribution-only' }
          foreach ($variant in $variants) {
            $featureArgs = @()
            if ($variant -eq 'attribution-only') { $featureArgs += '--no-default-features' }
            & cargo clippy @checkArgs @featureArgs --all-targets -- -D warnings
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            # Ignored native mutation tests require an explicitly authorized VM.
            & cargo test @checkArgs @featureArgs
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
