version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    ignore:
      # Keep the declarations aligned with the Node 26 build runtime.
      - dependency-name: '@types/node'
        versions: ['>=27']
      # React JS plugins require the TS6 API; @typescript/native supplies TS7.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      routine-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directories:
      - /service
      - /service/capture
      - /src-tauri
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      routine-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      routine-updates:
        patterns: ['*']
        update-types: [minor, patch]
