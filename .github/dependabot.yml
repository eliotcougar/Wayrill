version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      routine-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directories:
      - /service
      - /service/capture
      - /src-tauri
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      routine-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      routine-updates:
        patterns: ['*']
        update-types: [minor, patch]
