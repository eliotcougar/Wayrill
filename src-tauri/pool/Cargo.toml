[package]
name = "wayrill-pool"
version = "0.1.8"
description = "Wayrill Pool administration"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-single-instance = "2.5.2"
serde_json = "1"
url = "2"
wayrill-ipc = { path = "../../service/ipc" }
wayrill-protocol = { path = "../../service/protocol" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_System_Com", "Win32_Networking_WinHttp"] }
